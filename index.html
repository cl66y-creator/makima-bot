<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0010" />
  <title>Makima - Cl66y AI Assistant</title>
  <link rel="icon" href="avatar.png" />
  <style>
    :root {
      --bg: #07000c;
      --panel: rgba(18, 6, 28, 0.82);
      --pink: #ff2e93;
      --pink-soft: #ff7ac0;
      --violet: #9b2cff;
      --text: #f5e9f3;
      --muted: #a58ba3;
      --border: rgba(255, 46, 147, 0.28);
      --glow: 0 0 8px rgba(255, 46, 147, .75), 0 0 22px rgba(255, 46, 147, .45);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 700px at 80% -10%, #3a0a3d 0%, transparent 60%),
                  radial-gradient(900px 600px at -10% 110%, #3d0626 0%, transparent 55%), var(--bg);
      color: var(--text);
      font: 16px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      overflow: hidden;
    }

    /* ---------- animated background ---------- */
    #petals { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .grid-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .18;
      background-image: linear-gradient(rgba(255,46,147,.25) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,46,147,.25) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
      animation: drift 18s linear infinite;
    }
    @keyframes drift { to { background-position: 46px 46px; } }

    /* ---------- layout ---------- */
    .app {
      position: relative; z-index: 1; height: 100%; max-width: 820px; margin: 0 auto;
      display: flex; flex-direction: column;
      background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
      box-shadow: 0 0 60px rgba(255, 46, 147, .12);
    }

    header {
      position: relative; z-index: 5; display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,46,147,.12), transparent);
    }
    header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--pink), var(--violet), transparent);
      animation: sweep 4s ease-in-out infinite; opacity: .9;
    }
    @keyframes sweep { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

    .avatar {
      position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 20px;
      box-shadow: var(--glow); overflow: hidden;
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .avatar.ring::before {
      content: ""; position: absolute; inset: -3px; border-radius: 50%;
      border: 2px solid transparent; border-top-color: var(--pink-soft); border-bottom-color: var(--violet);
      animation: spin 3.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .online { display: inline-flex; align-items: center; gap: 6px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #3dff9e;
      box-shadow: 0 0 6px #3dff9e; animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    .title { flex: 1; min-width: 0; }
    .title h1 {
      margin: 0; font-size: 17px; letter-spacing: .3px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      color: #fff; text-shadow: 0 0 6px rgba(255,46,147,.9), 0 0 18px rgba(255,46,147,.55);
    }
    .title small { color: var(--muted); font-size: 12px; }

    /* ---------- neon dropdown menu ---------- */
    .menu { position: relative; }
    .menu-btn {
      width: 44px; height: 44px; border-radius: 12px; cursor: pointer;
      background: rgba(255,46,147,.08); border: 1px solid var(--pink);
      box-shadow: var(--glow), inset 0 0 10px rgba(255,46,147,.25);
      display: grid; place-items: center; transition: transform .25s, background .25s;
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 6px rgba(255,46,147,.6), 0 0 14px rgba(255,46,147,.3), inset 0 0 8px rgba(255,46,147,.2); }
      50% { box-shadow: 0 0 12px rgba(255,46,147,.95), 0 0 30px rgba(255,46,147,.6), inset 0 0 14px rgba(255,46,147,.4); }
    }
    .menu-btn:hover { transform: scale(1.06); background: rgba(255,46,147,.18); }
    .menu-btn span {
      display: block; width: 20px; height: 2px; background: #fff; border-radius: 2px; margin: 2.5px 0;
      box-shadow: 0 0 6px var(--pink), 0 0 12px var(--pink);
      transition: transform .35s cubic-bezier(.7,0,.2,1), opacity .25s, width .25s;
    }
    .menu-btn span:nth-child(2) { width: 14px; margin-left: auto; }
    .menu.open .menu-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu.open .menu-btn span:nth-child(2) { opacity: 0; transform: translateX(10px); }
    .menu.open .menu-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .dropdown {
      position: absolute; right: 0; top: calc(100% + 12px); width: 238px; padding: 8px;
      list-style: none; margin: 0;
      background: rgba(14, 4, 22, .96); border: 1px solid var(--pink); border-radius: 16px;
      box-shadow: var(--glow), 0 18px 40px rgba(0,0,0,.6);
      transform-origin: top right; transform: scale(.85) translateY(-10px); opacity: 0; visibility: hidden;
      transition: transform .3s cubic-bezier(.2,.9,.3,1.2), opacity .25s, visibility .25s;
    }
    .menu.open .dropdown { transform: none; opacity: 1; visibility: visible; }
    .dropdown li { opacity: 0; transform: translateX(14px); }
    .menu.open .dropdown li { animation: slideIn .4s forwards; }
    .menu.open .dropdown li:nth-child(1) { animation-delay: .05s; }
    .menu.open .dropdown li:nth-child(2) { animation-delay: .10s; }
    .menu.open .dropdown li:nth-child(3) { animation-delay: .15s; }
    .menu.open .dropdown li:nth-child(4) { animation-delay: .20s; }
    .menu.open .dropdown li:nth-child(5) { animation-delay: .25s; }
    @keyframes slideIn { to { opacity: 1; transform: none; } }
    .dropdown a {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px;
      color: var(--text); text-decoration: none; font-size: 15px; transition: background .2s, box-shadow .2s, transform .2s;
    }
    .dropdown a .ico {
      width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px;
      border: 1px solid var(--pink); color: var(--pink-soft); font-size: 15px;
      box-shadow: 0 0 8px rgba(255,46,147,.5), inset 0 0 6px rgba(255,46,147,.3);
    }
    .dropdown a:hover, .dropdown a:focus-visible {
      background: rgba(255,46,147,.14); box-shadow: 0 0 14px rgba(255,46,147,.4); transform: translateX(-3px); outline: none;
    }
    .dropdown a:hover .ico { color: #fff; box-shadow: 0 0 14px var(--pink), inset 0 0 8px var(--pink); }

    /* ---------- chat ---------- */
    #log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    #log::-webkit-scrollbar { width: 6px; }
    #log::-webkit-scrollbar-thumb { background: rgba(255,46,147,.4); border-radius: 6px; }

    .row { display: flex; gap: 10px; align-items: flex-end; animation: pop .35s ease-out; }
    .row.user { justify-content: flex-end; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
    .row .avatar { width: 34px; height: 34px; font-size: 15px; box-shadow: 0 0 10px rgba(255,46,147,.6); }

    .bubble {
      max-width: min(82%, 560px); padding: 11px 15px; border-radius: 18px;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    }
    .bot .bubble {
      background: rgba(255,255,255,.05); border: 1px solid var(--border); border-bottom-left-radius: 5px;
      box-shadow: 0 0 14px rgba(255,46,147,.1);
    }
    .user .bubble {
      background: linear-gradient(135deg, #ff2e93, #b3126a 60%, #7a1fd1); color: #fff; border-bottom-right-radius: 5px;
      box-shadow: 0 4px 18px rgba(255,46,147,.35);
    }
    .bubble.error { border-color: #ff4d6d; color: #ff9bb0; }
    .bubble a { color: var(--pink-soft); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
    .bubble a:hover { color: #fff; text-shadow: 0 0 8px var(--pink); }

    .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); animation: bounce 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-7px); opacity: 1; } }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; cursor: pointer; padding: 7px 13px; border-radius: 999px; font-size: 13px; color: var(--pink-soft);
      background: rgba(255,46,147,.08); border: 1px solid var(--border); transition: all .2s;
    }
    .chip:hover { color: #fff; border-color: var(--pink); box-shadow: 0 0 12px rgba(255,46,147,.55); transform: translateY(-2px); }

    form { display: flex; gap: 10px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
    textarea {
      flex: 1; resize: none; max-height: 140px; padding: 12px 14px; font: inherit; color: var(--text);
      background: rgba(0,0,0,.45); border: 1px solid var(--border); border-radius: 14px; transition: border-color .2s, box-shadow .2s;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 14px rgba(255,46,147,.45); }
    #send {
      width: 48px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font-size: 20px;
      background: linear-gradient(135deg, var(--pink), var(--violet)); box-shadow: 0 0 16px rgba(255,46,147,.55);
      transition: transform .2s, box-shadow .2s;
    }
    #send:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 0 26px rgba(255,46,147,.9); }
    #send:disabled { opacity: .45; cursor: not-allowed; }

    @media (max-width: 480px) {
      .title small { display: none; }
      .title h1 { font-size: 15px; }
      .bubble { max-width: 86%; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="petals"></canvas>
  <div class="grid-glow"></div>

  <div class="app">
    <header>
      <div class="avatar ring">
        <span>M</span>
        <img src="avatar.png" alt="Makima" onerror="this.remove()" />
      </div>
      <div class="title">
        <h1>Makima - Cl66y AI Assistant</h1>
        <small class="online"><i class="dot"></i>Online</small>
      </div>

      <nav class="menu" id="menu">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-haspopup="true">
          <div><span></span><span></span><span></span></div>
        </button>
        <ul class="dropdown" id="dropdown">
          <li><a href="https://discord.com/invite/chhxy399ec" target="_blank" rel="noopener noreferrer"><b class="ico">💬</b>Community</a></li>
          <li><a href="https://discord.com/channels/1154152314156896256/1482265504768069712" target="_blank" rel="noopener noreferrer"><b class="ico">🎬</b>Anime Clips</a></li>
          <li><a href="https://discord.com/channels/1154152314156896256/1480187443218092183" target="_blank" rel="noopener noreferrer"><b class="ico">🖼️</b>Anime Panels</a></li>
          <li><a href="https://www.youtube.com/@cl66y.discord" target="_blank" rel="noopener noreferrer"><b class="ico">▶</b>YouTube</a></li>
          <li><a href="https://www.tiktok.com/@cl66y.dc?_r=1&_t=ZS-9ArAWUYYWoQ" target="_blank" rel="noopener noreferrer"><b class="ico">♪</b>TikTok</a></li>
        </ul>
      </nav>
    </header>

    <div id="log"></div>

    <div class="chips" id="chips">
      <button class="chip" data-q="capcutlink">CapCut Pro</button>
      <button class="chip" data-q="alightmotionlink">Alight Motion</button>
      <button class="chip" data-q="twixtorlink">VSCO</button>
      <button class="chip" data-q="sharpifylink">Meitu</button>
      <button class="chip" data-q="aftermotionzlink">After Motion Z+</button>
      <button class="chip" data-q="bgremoverlink">Pixelcut Pro</button>
      <button class="chip" data-q="picturefylink">Picsart Gold</button>
    </div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Message Makima…" autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Send">➤</button>
    </form>
  </div>

  <script>
    const INTRO = `Hello! I'm Makima, your AI Assistant 🤖

I can help you with anime editing resources! Try asking me for:

*AVAILABLE COMMANDS:*
• capcutlink — Download CapCut Pro
• alightmotionlink — Download Alight Motion Premium
• twixtorlink — Download VSCO
• sharpifylink — Download Meitu Premium
• aftermotionzlink — Download After Motion Z+
• bgremoverlink — Download Pixelcut Pro
• picturefylink — Download Picsart Gold

*WHAT WE OFFER:*
• 📱 Latest app versions and updates
• 🎞️ Free editing tools and techniques
• 💎 Premium editing features
• ⚡ Tools to enhance your editing workflow

🌐 Join Our Discord for more!

Simply type a command to explore the available apps, or just chat with me! ✨`;

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    let history = [];

    /* ---- message rendering (safe: no innerHTML, links built as DOM nodes) ---- */
    function fillWithLinks(el, text) {
      // Handles clickable links and *bold* headings
      const re = /(https?:\/\/[^\s<>"')]+)|\*([^*\n]+)\*/g;
      let last = 0, m;
      while ((m = re.exec(text))) {
        if (m.index > last) el.append(text.slice(last, m.index));
        if (m[1]) {
          const a = document.createElement("a");
          a.href = m[1]; a.textContent = m[1]; a.target = "_blank"; a.rel = "noopener noreferrer";
          el.append(a);
        } else {
          const b = document.createElement("strong");
          b.textContent = m[2];
          el.append(b);
        }
        last = m.index + m[0].length;
      }
      if (last < text.length) el.append(text.slice(last));
    }

    function botAvatar() {
      const av = document.createElement("div");
      av.className = "avatar";
      av.innerHTML = '<span>M</span>';
      const img = document.createElement("img");
      img.src = "avatar.png"; img.alt = "Makima"; img.onerror = () => img.remove();
      av.append(img);
      return av;
    }

    function addMessage(role, text, isError = false) {
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "bot");
      if (role !== "user") row.append(botAvatar());
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");
      fillWithLinks(bubble, text);
      row.append(bubble);
      log.append(row);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    function addTyping() {
      const bubble = addMessage("assistant", "");
      bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      return bubble;
    }

    async function send(text) {
      text = (text ?? input.value).trim();
      if (!text || sendBtn.disabled) return;
      input.value = ""; input.style.height = "auto";
      addMessage("user", text);
      history.push({ role: "user", content: text });
      sendBtn.disabled = true;
      const bubble = addTyping();
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong");
        bubble.textContent = "";
        fillWithLinks(bubble, data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        bubble.textContent = "Error: " + err.message;
        bubble.classList.add("error");
        history.pop();
      } finally {
        sendBtn.disabled = false;
        log.scrollTop = log.scrollHeight;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
    document.getElementById("chips").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip"); if (chip) send(chip.dataset.q);
    });

    /* ---- dropdown menu ---- */
    const menu = document.getElementById("menu");
    const menuBtn = document.getElementById("menuBtn");
    function setMenu(open) { menu.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", open); }
    menuBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(!menu.classList.contains("open")); });
    document.addEventListener("click", (e) => { if (!menu.contains(e.target)) setMenu(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

    /* ---- intro message ---- */
    addMessage("assistant", INTRO);

    /* ---- falling sakura petals ---- */
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const c = document.getElementById("petals"), ctx = c.getContext("2d");
      let w, h, petals = [];
      function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
      addEventListener("resize", resize); resize();
      const make = (top) => ({
        x: Math.random() * w, y: top ? -20 : Math.random() * h, r: 3 + Math.random() * 5,
        vy: .4 + Math.random() * .9, vx: -.3 + Math.random() * .6, rot: Math.random() * 6.28,
        vr: -.02 + Math.random() * .04, a: .25 + Math.random() * .45, sway: Math.random() * 6.28,
      });
      for (let i = 0; i < 38; i++) petals.push(make(false));
      (function frame() {
        ctx.clearRect(0, 0, w, h);
        for (const p of petals) {
          p.sway += .02; p.x += p.vx + Math.sin(p.sway) * .5; p.y += p.vy; p.rot += p.vr;
          if (p.y > h + 20) Object.assign(p, make(true));
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = p.a;
          ctx.shadowColor = "#ff2e93"; ctx.shadowBlur = 10; ctx.fillStyle = "#ff4fa6";
          ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.283); ctx.fill(); ctx.restore();
        }
        requestAnimationFrame(frame);
      })();
    })();
  </script>
</body>
</html>
